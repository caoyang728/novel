# version: '3.8'  # Docker Compose V2 已不再需要此字段

services:
  # ==================== 缓存 / Celery Broker ====================
  redis:
    image: redis:8.0-alpine   # alpine 版: 体积小 (≈30MB vs ≈120MB)、内存少 ≈50MB，缺点 musl libc 极端场景性能略低于 glibc，本项目足够
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # 使用 Docker 卷数据持久化, 需要定期脚本备份数据
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_DB_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --requirepass ${REDIS_DB_PASSWORD}
      --bind 0.0.0.0
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --ignore-warnings ARM64-COW-BUG
      --ignore-warnings MEMORY
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 512M              # 10G 预算分配 512M

  # ==================== 业务库 + 向量库（合一）PostgreSQL 16 + pgvector ====================
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${PG_DB_USER:-novel_agent}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD:?PG_DB_PASSWORD required}
      POSTGRES_DB: ${PG_DB_DATABASE:-novel_agent}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    command: |
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c work_mem=8MB
      -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER:-novel_agent} -d ${PG_DB_DATABASE:-novel_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 2G                  # 10G 预算分配 2G

  django:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ROLE: web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app                        # 挂载本地代码，本地修改自动同步到容器
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G                  # 10G 预算分配 2G

  # ==================== Celery Worker（执行异步任务）====================
  celery-worker:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ROLE: worker
      CELERY_CONCURRENCY: 4
      C_FORCE_ROOT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app                        # 挂载本地代码，本地修改自动同步到容器
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G 

  # ==================== Celery Beat（定时任务调度，只能 1 副本） ====================
  celery-beat:
    build: .
    env_file:
      - .env
    environment:
      DJANGO_ROLE: beat
      C_FORCE_ROOT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app                        # 挂载本地代码，本地修改自动同步到容器
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M                 # 10G 预算分配 512M（调度器不需要太多）

  # ==================== Nginx（反向代理 + 静态文件服务） ====================
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M 

  # ==================== 本地 Embedding 服务（bge-large-zh-v1.5） ====================
  # ※ 低内存服务器可注释此服务，启用知识库 API（.env 中 EMBEDDING_PREFER_DOCKER=false）
  # ※ 启用后需取消注释 EMBEDDING_DOCKER_URL 环境变量
  # embedding:
  #   build:
  #     context: ./docker/embedding
  #   container_name: novel-embedding
  #   environment:
  #     - MODEL_NAME=BAAI/bge-large-zh-v1.5
  #     - DEVICE=cpu
  #     - HF_ENDPOINT=https://hf-mirror.com
  #   ports:
  #     - "8080:8000"
  #   volumes:
  #     - embedding_cache:/root/.cache/huggingface
  #   restart: always
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 6G                  # 16G 总预算分配 6G（embedding 模型内存大户）

volumes:
  pg_data:
  redis_data:
  static_volume:
  # embedding_cache:
